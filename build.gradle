plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.firebase.crashlytics'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

def props = new Properties()
file("local.properties").withInputStream { props.load(it) }

android {
    namespace = "org.app.core"
    compileSdk 34

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        buildConfigField 'String', 'dm', props.getProperty("domain")
        buildConfigField 'String', 'iv', props.getProperty("iv")
        buildConfigField 'String', 'secret', props.getProperty("secret")
        buildConfigField 'String', 'fbV1Dm', props.getProperty("fbv1domain")
        buildConfigField 'String', 'translateDm', props.getProperty("translatedm")
        buildConfigField 'String', 'translateWebDm', props.getProperty("translatewebdm")
        buildConfigField 'String', 'crawldm', props.getProperty("crawldm")
        buildConfigField 'String', 'socialdm', props.getProperty("socialdm")
        buildConfigField 'String', 'ttdm', props.getProperty("ttdm")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions.add("platform")
    productFlavors {
        create("applovin") {
        }
        create("admob") {
        }
    }

    lintOptions {
        abortOnError false
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
        dataBinding = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

afterEvaluate {
    pluginManager.withPlugin('com.jfrog.artifactory') {
        artifactoryPublish {
            publications(publishing.publications.release)
        }
    }
}


dependencies {

    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation("androidx.core:core-ktx:1.9.0")

    implementation("com.google.firebase:firebase-config-ktx:22.0.0")
    implementation("com.google.firebase:firebase-analytics-ktx:22.1.0")
    admobImplementation("com.google.android.gms:play-services-ads:23.6.0")

    // g son
    implementation 'com.google.code.gson:gson:2.10.1'

    // lifecycle
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.5"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.8.5"

    // Shimmer
    implementation 'com.facebook.shimmer:shimmer:0.5.0@aar'

    //lottie
    implementation 'com.airbnb.android:lottie:5.2.0'

    //coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    implementation("androidx.work:work-runtime-ktx:2.9.1")

    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    implementation "com.google.mlkit:translate:17.0.3"

    implementation("com.github.bumptech.glide:glide:4.16.0")
    kapt("com.github.bumptech.glide:compiler:4.16.0")

    applovinImplementation("com.applovin:applovin-sdk:+")
    applovinImplementation("com.google.android.gms:play-services-ads-identifier:18.0.1")
    applovinImplementation("com.applovin.mediation:google-adapter:+")

    // dimens
    implementation(Libraries.sdpAndroid)
    implementation(Libraries.sspAndroid)

    // Hilt
    implementation(Libraries.hilt)
    kapt(Libraries.hiltDaggerCompiler)

    // Support
    implementation(Libraries.appCompat)
    implementation(Libraries.coreKtx)
    implementation(Libraries.androidSupport)
    implementation(Libraries.lifecycle)
    implementation(Libraries.lifeData)

    // Arch Components
    implementation(Libraries.viewModel)
    implementation(Libraries.localization)

    // UI
    implementation(Libraries.navigationFragment)
    implementation(Libraries.navigationUI)
    implementation(Libraries.alerter)

    // dimens
    implementation(Libraries.sdpAndroid)
    implementation(Libraries.sspAndroid)

    // Hilt
    implementation(Libraries.hilt)
    kapt(Libraries.hiltDaggerCompiler)

    // Image
    api(Libraries.timber)
    api(Libraries.xrecyclerview)

    // Lottie
    implementation(Libraries.lottie)

    // Room
    implementation(Libraries.room)
    kapt(Libraries.roomCompiler)
    implementation(Libraries.roomKtx)

    // Networking
    implementation(Libraries.retrofit)
    implementation(Libraries.retrofitConverter)
    implementation(Libraries.interceptor)
    implementation(Libraries.chuckLogging)
    implementation(Libraries.scalarConverter)

    // request permission
    implementation("com.guolindev.permissionx:permissionx:1.6.4")
    implementation("androidx.webkit:webkit:1.11.0")

    // Firebase crash
    implementation("com.google.firebase:firebase-crashlytics-ktx:19.0.3")
    implementation("com.google.firebase:firebase-analytics-ktx")
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-config-ktx:22.0.0")
    implementation("com.facebook.shimmer:shimmer:0.5.0")

    implementation("androidx.activity:activity-ktx:1.9.2")
    implementation("org.jsoup:jsoup:1.16.1")
    implementation("com.android.billingclient:billing-ktx:7.1.1")

}

